<script type="module">
import * as THREE from 'three';

/* ================= 基础工具 ================= */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
function rng32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const TRS=(x,y,z,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1)=>new THREE.Matrix4().compose(V3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)),V3(sx,sy,sz));
const UBOX=new THREE.BoxGeometry(1,1,1), USPH=new THREE.SphereGeometry(1,18,12), YAX=V3(0,1,0);
const _cyl={};const ucyl=s=>_cyl[s]||(_cyl[s]=new THREE.CylinderGeometry(1,1,1,s));

function mergeGeos(list){
  let total=0;for(const it of list){it.cnt=it.g.index?it.g.index.count:it.g.attributes.position.count;total+=it.cnt;}
  const P=new Float32Array(total*3),N=new Float32Array(total*3),U=new Float32Array(total*2);
  const hasC=list[0].c!==undefined,C=hasC?new Float32Array(total*3):null;
  const v=V3(),nm=new THREE.Matrix3();let o=0;
  for(const it of list){const g=it.g,pa=g.attributes.position,na=g.attributes.normal,ua=g.attributes.uv,idx=g.index;
    nm.getNormalMatrix(it.m);const flip=it.m.determinant()<0;
    for(let i=0;i<it.cnt;i++){let k=i;if(flip){const r=i%3;k=i-r+(r===0?0:r===1?2:1);}
      const vi=idx?idx.getX(k):k;
      v.fromBufferAttribute(pa,vi).applyMatrix4(it.m);P[o*3]=v.x;P[o*3+1]=v.y;P[o*3+2]=v.z;
      if(na){v.fromBufferAttribute(na,vi).applyMatrix3(nm).normalize();N[o*3]=v.x;N[o*3+1]=v.y;N[o*3+2]=v.z;}
      if(ua){U[o*2]=ua.getX(vi);U[o*2+1]=ua.getY(vi);}
      if(hasC){C[o*3]=C[o*3+1]=C[o*3+2]=it.c;}
      o++;}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(N,3));g.setAttribute('uv',new THREE.BufferAttribute(U,2));
  if(hasC)g.setAttribute('color',new THREE.BufferAttribute(C,3));

}
class Kit{

  box(mat,w,h,d,x,y,z,rx=0,ry=0,rz=0){return this.add(mat,UBOX,TRS(x,y,z,rx,ry,rz,w,h,d));}
  cyl(mat,r,len,x,y,z,axis='y',seg=12){return this.add(mat,ucyl(seg),TRS(x,y,z,axis==='z'?Math.PI/2:0,0,axis==='x'?-Math.PI/2:0,r,len,r));}
  cone(mat,r1,r2,len,x,y,z,axis='y',seg=12){return this.add(mat,new THREE.CylinderGeometry(r2,r1,len,seg),TRS(x,y,z,axis==='z'?Math.PI/2:0,0,axis==='x'?-Math.PI/2:0));}
  sph(mat,r,x,y,z,sx=1,sy=1,sz=1){return this.add(mat,USPH,TRS(x,y,z,0,0,0,r*sx,r*sy,r*sz));}
  strut(mat,a,b,r,seg=6){const A=V3(...a),B=V3(...b),d=B.clone().sub(A),len=d.length();const q=new THREE.Quaternion().setFromUnitVectors(YAX,d.normalize());
    return this.add(mat,ucyl(seg),new THREE.Matrix4().compose(A.add(B).multiplyScalar(.5),q,V3(r,len,r)));}
  beam(mat,a,b,w,h){const A=V3(...a),B=V3(...b),z=B.clone().sub(A),len=z.length();z.normalize();
    const up=Math.abs(z.y)>.99?V3(1,0,0):V3(0,1,0),x=up.cross(z).normalize(),y=z.clone().cross(x);
    const m=new THREE.Matrix4().makeBasis(x,y,z);m.scale(V3(w,h,len));m.setPosition(A.add(B).multiplyScalar(.5));return this.add(mat,UBOX,m);}
  build(){const g=new THREE.Group();for(const [mat,list] of this.map){const me=new THREE.Mesh(mergeGeos(list),mat);me.castShadow=!mat.transparent;me.receiveShadow=!mat.transparent;g.add(me);}return g;}
}
function canvasTex(w,h,draw,o={}){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
  if(!o.data)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(o.repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(o.repeat[0],o.repeat[1]);}return t;}
const std=(color,roughness=.6,metalness=0,ex={})=>new THREE.MeshStandardMaterial({color,roughness,metalness,...ex});
function railing(K,mat,pts,h=1.1,r=.025){for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],len=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]),n=Math.max(1,Math.round(len/1.6));
  for(const f of[1,.5])K.strut(mat,[a[0],a[1]+h*f,a[2]],[b[0],b[1]+h*f,b[2]],r,5);
  for(let j=0;j<=n;j++){const p=lerp3(a,b,j/n);K.strut(mat,p,[p[0],p[1]+h,p[2]],r,5);}}}
function flight(K,mat,a,b,w){const d=V3(b[0]-a[0],0,b[2]-a[2]).normalize(),p=V3(0,1,0).cross(d);
  for(const s of[-1,1]){const o=[p.x*s*w/2,0,p.z*s*w/2],A=[a[0]+o[0],a[1],a[2]+o[2]],B=[b[0]+o[0],b[1],b[2]+o[2]];
    K.beam(mat,A,B,.04,.2);K.strut(mat,[A[0],A[1]+1,A[2]],[B[0],B[1]+1,B[2]],.022,5);
    for(const t of[0,.5,1]){const q=lerp3(A,B,t);K.strut(mat,q,[q[0],q[1]+1,q[2]],.022,5);}}
  const n=Math.max(2,Math.round(Math.abs(b[1]-a[1])/.24));
  for(let j=0;j<n;j++){const q=lerp3(a,b,(j+.5)/n);K.beam(mat,[q[0]-p.x*w/2,q[1],q[2]-p.z*w/2],[q[0]+p.x*w/2,q[1],q[2]+p.z*w/2],.24,.03);}}

/* ================= 渲染器 / 场景 ================= */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,1,7000);
const SUN_DIR=V3(.55,.72,.42).normalize();
const pmrem=new THREE.PMREMGenerator(renderer);
function skyEnv(){const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(500,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{sun:{value:SUN_DIR}},
    vertexShader:'varying vec3 d;void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:`varying vec3 d;uniform vec3 sun;void main(){vec3 n=normalize(d);float h=n.y;
      vec3 c=h>0.?mix(vec3(.74,.84,.94),vec3(.16,.38,.74),pow(h,.5)):mix(vec3(.74,.84,.94),vec3(.22,.27,.30),pow(-h,.35));
      float s=max(dot(n,sun),0.);c+=vec3(1.,.92,.75)*(pow(s,600.)*30.+pow(s,10.)*.22);
      float cl=sin(n.x*9.+n.z*5.)*sin(n.z*11.-n.x*3.)*.5+.5;c=mix(c,vec3(.95),smoothstep(.72,.95,cl)*smoothstep(.02,.25,h)*.35);

function studioEnv(){const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(100,24,12),new THREE.MeshBasicMaterial({color:0x2a2e35,side:THREE.BackSide})));
  const pan=(w,h,x,y,z,i,c=0xffffff)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(i),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);s.add(m);};
  pan(60,30,-20,70,20,9);pan(40,60,80,25,30,5,0xfff0dd);pan(30,50,-80,10,-40,3.5,0xcfe0ff);pan(80,12,0,-5,-90,2.5);pan(60,10,10,20,90,2,0xffe2c0);
  s.add(new THREE.Mesh(new THREE.PlaneGeometry(400,400).rotateX(-Math.PI/2).translate(0,-60,0),new THREE.MeshBasicMaterial({color:0x2c2f34})));

const ENV={sky:skyEnv(),studio:studioEnv()};
const sun=new THREE.DirectionalLight(0xfff0dc,3.0);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xbcd4ff,.0);scene.add(fill);
const hemi=new THREE.HemisphereLight(0xcfe2ff,0x3a3d40,.35);scene.add(hemi);

/* ================= 材质 ================= */
const concreteTex=canvasTex(512,512,(c,w,h)=>{c.fillStyle='#8b8d8a';c.fillRect(0,0,w,h);const r=rng32(3);
  for(let i=0;i<9000;i++){const g=110+r()*60|0;c.fillStyle=`rgba(${g},${g},${g-3},.22)`;c.fillRect(r()*w,r()*h,1+r()*3,1+r()*3);}
  for(let i=0;i<40;i++){c.fillStyle=`rgba(40,38,35,${.04+r()*.07})`;c.beginPath();c.ellipse(r()*w,r()*h,8+r()*40,4+r()*14,r()*3,0,7);c.fill();}
  c.strokeStyle='rgba(50,50,48,.55)';c.lineWidth=2;c.strokeRect(1,1,w-2,h-2);c.beginPath();c.moveTo(w/2,0);c.lineTo(w/2,h);c.stroke();},{repeat:[8,26]});
const M={
  struct:std(0xc6442a,.5,.3),white:std(0xe6e4dc,.55,.1),white2:std(0xcfd2d0,.6,.1),steel:std(0x8b9197,.35,.9),dark:std(0x24272b,.6,.5),
  yellow:std(0xe0a51c,.5,.2),rail:std(0xd8ae2a,.5,.3),rope:std(0x2a2c2f,.5,.8),concrete:std(0x7d807d,.95,0),rubber:std(0x111213,.9,0),
  grating:std(0x4a4f55,.7,.6),lamp:std(0xffffff,.4,0,{emissive:0xfff0c8,emissiveIntensity:2.5}),red:std(0xff2a1a,.4,0,{emissive:0xff2010,emissiveIntensity:3}),
  glass:new THREE.MeshPhysicalMaterial({color:0xa6d4de,roughness:.05,metalness:0,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false,envMapIntensity:1.6}),
  win:std(0x0b1a27,.08,.7),deck:std(0x5d3a33,.8,.1),hatch:std(0x70767c,.6,.3),orange:std(0xe5561a,.5,.1),bronze:std(0xb48a3a,.3,1),
  navy:std(0x16283c,.55,.15,{side:THREE.DoubleSide}),anti:std(0x7a2c25,.7,.05),line:std(0xf2f2ee,.8,0),yline:std(0xe6b422,.8,0),
  cont:std(0xffffff,.62,.25,{vertexColors:true}),

/* ================= 集装箱（波纹板 / 角件 / 门杆） ================= */
function corrGeo(len,y0,y1,depth,pitch){const n=Math.max(2,Math.round(len/pitch)),p=len/n,pts=[],pos=[];
  for(let i=0;i<n;i++){const x=-len/2+i*p;pts.push([x,0],[x+p*.36,0],[x+p*.5,-depth],[x+p*.86,-depth]);}pts.push([len/2,0]);
  for(let i=0;i<pts.length-1;i++){const[xa,za]=pts[i],[xb,zb]=pts[i+1];pos.push(xa,y0,za,xb,y0,zb,xb,y1,zb,xa,y0,za,xb,y1,zb,xa,y1,za);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return g;}
const CW=2.438,CH=2.591,L40=12.192,L20=6.058;
function makeContainerGeo(L){const W=CW,H=CH,k=new Kit(),m=0;k.shade=1;
  const side=corrGeo(L-.3,.17,H-.1,.036,.3);k.add(m,side,TRS(W/2-.012,0,0,0,Math.PI/2,0));k.add(m,side,TRS(-W/2+.012,0,0,0,-Math.PI/2,0));
  k.add(m,corrGeo(W-.3,.17,H-.1,.036,.26),TRS(0,0,-L/2+.012,0,Math.PI,0));
  k.box(m,W-.1,.03,L-.1,0,H-.035,0);k.box(m,W-.1,.12,L-.1,0,.1,0);
  for(let i=1;i<Math.round(L/1.2);i++)k.box(m,W-.3,.02,.12,0,H-.012,-L/2+i*L/Math.round(L/1.2));
  k.shade=.86;
  for(const sx of[-1,1]){k.box(m,.07,.1,L-.3,sx*(W/2-.04),H-.05,0);k.box(m,.09,.16,L-.3,sx*(W/2-.05),.09,0);
    for(const sz of[-1,1])k.box(m,.15,H-.2,.15,sx*(W/2-.085),H/2,sz*(L/2-.085));}
  for(const sz of[-1,1]){k.box(m,W-.3,.12,.1,0,H-.06,sz*(L/2-.06));k.box(m,W-.3,.16,.1,0,.09,sz*(L/2-.06));}
  k.shade=.95;for(const sx of[-1,1])k.box(m,(W-.34)/2-.012,H-.36,.03,sx*(W-.34)/4,H/2,L/2-.04);
  k.shade=.68;for(const x of[-.82,-.3,.3,.82]){k.cyl(m,.018,H-.3,x,H/2,L/2-.008,'y',6);k.box(m,.07,.05,.035,x,.2,L/2-.008);k.box(m,.07,.05,.035,x,H-.2,L/2-.008);k.box(m,.04,.04,.04,x,1.15,L/2-.004);}
  for(const x of[-.56,.56])k.box(m,.42,.03,.02,x,1.15,L/2+.012);
  for(const sx of[-1,1])for(const y of[.4,.95,1.5,2.05])k.box(m,.05,.12,.03,sx*(W/2-.17),y,L/2-.012);
  k.shade=.5;for(const sx of[-1,1])for(const sz of[-1,1])for(const y of[.059,H-.059])k.box(m,.166,.118,.182,sx*(W/2-.081),y,sz*(L/2-.089));
  return mergeGeos(k.map.get(m));}
const GEO40=makeContainerGeo(L40),GEO20=makeContainerGeo(L20);
const PALETTE=[0x9c2b23,0x1f4e79,0x2e6b4f,0xc8641f,0x8a8f94,0xd6d3ca,0x1b7a8c,0xb8962e,0x5a2d2d,0x243b6b,0x9c2b23,0x1f4e79,0xb23a2a];
function placeContainers(list,geo,parent){if(!list.length)return;const im=new THREE.InstancedMesh(geo,M.cont,list.length),col=new THREE.Color(),hsl={};
  list.forEach((c,i)=>{im.setMatrixAt(i,TRS(c.x,c.y,c.z,0,(c.ry||0)+(c.flip?Math.PI:0),0));col.setHex(c.col).getHSL(hsl);col.setHSL(hsl.h,hsl.s,clamp(hsl.l*(.88+((i*7919)%100)/400),0,1));im.setColorAt(i,col);});

/* ================= 码头 ================= */
const XS=-3.5,XL=-34,ZL=9.5,YG=38,YT=41.8,ZH=3,YTOP=44,APX=-6,APY=66,WATER=-2.5;
const SHIP={L:215,B:32.2,KEEL:-14,WL:WATER,DECK:5.5,X:17.5};
function buildDock(){const g=new THREE.Group(),K=new Kit(),r=rng32(11);
  K.box(M.concrete,160,7,520,-80,-3.52,0);K.box(M.concrete,1.2,1.2,520,-.55,-.62,0);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(160,520).rotateX(-Math.PI/2),std(0xffffff,.95,0,{map:concreteTex}));top.position.set(-80,0,0);top.receiveShadow=true;g.add(top);
  for(const x of[XS,XL]){K.box(M.dark,.7,.02,520,x,.01,0);K.box(M.steel,.1,.12,520,x,.06,0);}
  K.box(M.yline,.3,.03,520,-1.0,.015,0);for(let i=0;i<6;i++)K.box(M.line,.15,.03,520,-8.5-i*4.2,.015,0);
  for(let z=-248;z<=248;z+=16){K.cone(M.rubber,.95,.6,1.0,.5,-1.0,z,'x',14);K.box(M.dark,.18,2.6,2.0,1.1,-1.0,z);K.strut(M.steel,[0,-.1,z-.8],[1.05,-.2,z-.8],.03,4);K.strut(M.steel,[0,-.1,z+.8],[1.05,-.2,z+.8],.03,4);}
  for(let z=-240;z<=240;z+=24){K.box(M.dark,.9,.06,.9,-1.9,.03,z);K.cyl(M.dark,.26,.6,-1.9,.33,z,'y',12);K.cyl(M.yellow,.4,.16,-1.9,.7,z,'y',12);}
  for(const z of[-150,-50,50,150]){K.cone(M.white2,.45,.25,36,-46,18,z,'y',10);K.cyl(M.dark,1.6,.3,-46,36.2,z,'y',10);for(let a=0;a<8;a++)K.box(M.lamp,.5,.12,.35,-46+Math.cos(a*.785)*1.45,35.98,z+Math.sin(a*.785)*1.45);}
  const c40=[];
  for(const bx of[-66,-92,-118])for(let row=0;row<6;row++)for(let bay=-7;bay<=7;bay++){if(bx===-66&&Math.abs(bay)<1)continue;const h=1+Math.floor(r()*3.4);
    for(let t=0;t<h;t++)c40.push({x:bx+(row-2.5)*2.6,y:t*CH,z:bay*13.2,col:PALETTE[r()*PALETTE.length|0],flip:r()<.5});}
  placeContainers(c40,GEO40,g);g.add(K.build());return g;}
function buildWater(){const N=256,d=new Uint8Array(N*N*4),r=rng32(5),ws=[];
