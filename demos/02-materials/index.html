 {n:'木托盘',d:'逐块板条独立 UV 与色差，早晚材年轮、节疤、干裂与端面年轮，钉头为独立几何。',t:[2.5,.2,2.3],th:.55,ph:1.08,r:2.1,osc:.5},

const st={t:new V3(),th:0,ph:1,r:10},goal={t:new V3(),th:0,ph:1,r:10};window.__cam=goal;let cur=0,auto=!Q.has('still'),oscT=0,idle=9,osc=0;
function setView(i,snap){cur=i;const v=VIEWS[i];goal.t.fromArray(v.t);goal.th=v.th;goal.ph=v.ph;goal.r=v.r;oscT=0;idle=9;
  if(snap){st.t.copy(goal.t);st.th=goal.th;st.ph=goal.ph;st.r=goal.r}
  document.querySelectorAll('#bar button').forEach((b,k)=>b.classList.toggle('on',k===i));

function buildUI(){VIEWS.forEach((v,i)=>{const b=document.createElement('button');b.innerHTML='<i>'+i+'</i>'+v.n;b.onclick=()=>setView(i);bar.appendChild(b)});

  el.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;idle=0;
    if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pd)goal.r*=pd/d;pd=d;return}

const tick=()=>new Promise(r=>setTimeout(r,16));
async function boot(){
  const steps=[['噪声场',genNoise],['湿混凝土',genConcrete],['积水高度场',genGroundMacro],['锈蚀细节',genContainerDetail],['箱体喷涂与流锈',genContainerMacros],['镀锌锌花',genGalv],['橡胶',()=>{genRubber();genTire()}],['木纹',genWood],['铭牌',genPlate],
